<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>The Pilgrim's Road</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Marcellus+SC&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: a night-sky Byzantine mosaic world. An illustrated road map of six medallion stations; a pilgrim token walks the road; each station is a chunky, framed game board; rewards arrive in a treasure chest. */
:root{
  --grout:#0a1430;
  --night:#0c1736;
  --lapis:#0f1d3d;
  --lapis-2:#172a55;
  --lapis-3:#22396e;
  --lapis-4:#2f4d8f;
  --shadow:#050b1f;
  --gold:#f0c04f;
  --gold-hi:#ffe08a;
  --gold-deep:#b8862a;
  --gold-dark:#6e4d12;
  --ivory:#f6eedb;
  --muted:#aab4cd;
  --red:#d4553f;
  --red-dark:#7d2618;
  --olive:#93b956;
  --olive-dark:#4a6420;
  --line:rgba(240,192,79,.32);
  --panel:rgba(15,29,61,.94);
  --display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --game:"Fredoka","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--grout);color:var(--ivory);font-family:var(--body);font-size:16px;line-height:1.5;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--lapis)}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-2}
.vignette{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(ellipse at 50% 30%,rgba(10,20,48,.25),rgba(10,20,48,.9) 72%)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.wrap{max-width:1060px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,label:focus-within{outline:3px solid var(--gold-hi);outline-offset:3px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.eyebrow{font-family:var(--display);letter-spacing:.2em;font-size:.82rem;color:var(--muted);text-transform:uppercase}

/* ---------- Buttons: chunky, pressable ---------- */
.btn{font-family:var(--game);font-weight:600;font-size:1.08rem;letter-spacing:.01em;border:0;border-radius:14px;padding:12px 24px;background:var(--lapis-3);color:var(--ivory);
  box-shadow:0 5px 0 var(--shadow),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .08s,box-shadow .08s,filter .12s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.btn.primary{background:linear-gradient(var(--gold-hi),var(--gold) 55%,#e0a93a);color:#3a2706;box-shadow:0 5px 0 var(--gold-dark),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.primary:active:not(:disabled){box-shadow:0 1px 0 var(--gold-dark)}
.btn.ghost{background:var(--lapis-2);border:1px solid var(--line);box-shadow:0 4px 0 var(--shadow)}
.btn.small{padding:7px 14px;font-size:.92rem}
.btn.huge{font-size:1.35rem;padding:16px 36px;border-radius:18px}
.btn:disabled{opacity:.45;cursor:default}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--lapis),rgba(15,29,61,.96));border-bottom:2px solid var(--gold-deep);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.hud-in{max-width:1060px;margin:0 auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);color:var(--gold);font-size:1.05rem;letter-spacing:.06em;background:none;border:0;padding:0;display:flex;align-items:center;gap:8px}
.brand svg{flex:none}
.hud-sp{flex:1}
.lvl{display:flex;align-items:center;gap:8px;background:var(--lapis-2);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 3px}
.lvl-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--gold-hi),var(--gold-deep));color:#3a2706;font-family:var(--game);font-weight:700}
.lvl-t{display:grid;gap:2px;min-width:92px}
.lvl-t small{font-family:var(--game);font-weight:600;font-size:.78rem;line-height:1}
.xp{height:6px;border-radius:9px;background:var(--grout);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--olive),var(--gold));transition:width .5s}
.chip{display:flex;align-items:center;gap:6px;background:var(--lapis-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--game);font-weight:600;font-size:.9rem}
.chip b{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
.combo svg{color:var(--muted);transition:color .2s,transform .2s}
.cbar{width:34px;height:6px;border-radius:9px;background:var(--grout);overflow:hidden}
.cbar i{display:block;height:100%;width:0;background:var(--red);transition:width .3s}
.combo.warm svg{color:var(--gold)}
.combo.hot{border-color:var(--red);background:rgba(212,85,63,.25);animation:hotglow 1s ease-in-out infinite}
.combo.hot svg{color:var(--red);transform:scale(1.2)}
@keyframes hotglow{50%{box-shadow:0 0 16px rgba(212,85,63,.7)}}
.iconbtn{background:var(--lapis-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--game);font-weight:600;font-size:.9rem;display:flex;gap:6px;align-items:center}
@media (max-width:640px){.hide-sm{display:none!important}}

/* ---------- Title ---------- */
.title-screen{padding-block:44px 16px;display:grid;gap:22px;justify-items:center;text-align:center;position:relative}
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.motes span{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold-hi);box-shadow:0 0 10px var(--gold);opacity:0;animation:mote 7s linear infinite}
@keyframes mote{0%{transform:translateY(40px);opacity:0}20%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}
.crest{width:120px;height:120px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.big{font-family:var(--display);font-size:clamp(2.7rem,9vw,5.6rem);line-height:.95;
  background:linear-gradient(100deg,var(--gold-deep) 0%,var(--gold) 25%,var(--gold-hi) 45%,var(--gold) 60%,var(--gold-deep) 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 5s linear infinite;filter:drop-shadow(0 4px 0 rgba(110,77,18,.9)) drop-shadow(0 12px 30px rgba(240,192,79,.25))}
@keyframes shimmer{from{background-position:120% 0}to{background-position:-100% 0}}
.lede{max-width:36em;font-size:1.1rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.start-panel{width:min(600px,100%);box-sizing:border-box;display:grid;gap:18px;text-align:left}
.flabel{font-family:var(--game);font-weight:600;font-size:.95rem;color:var(--gold)}
.start-panel input[type=text]{width:100%;box-sizing:border-box;font:inherit;font-family:var(--game);font-size:1.25rem;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--grout);color:var(--ivory)}
.avatars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.av{position:relative;display:grid;justify-items:center;gap:4px;padding:10px 4px 8px;border-radius:14px;background:var(--lapis-2);border:2px solid transparent;cursor:pointer;transition:transform .12s}
.av input{position:absolute;opacity:0;pointer-events:none}
.av span{font-family:var(--game);font-size:.82rem;font-weight:600;color:var(--muted)}
.av:hover{transform:translateY(-3px)}
.av:has(input:checked){border-color:var(--gold);background:rgba(240,192,79,.14)}
.av:has(input:checked) span{color:var(--gold)}
.av:has(input:checked) svg{animation:hop .5s}
@keyframes hop{40%{transform:translateY(-8px) rotate(-6deg)}}
.how{display:grid;gap:8px;padding:0;margin:0;list-style:none;color:var(--muted);font-size:.95rem}
.how li{display:flex;gap:10px;align-items:flex-start}
.how li svg{flex:none;margin-top:3px}

/* ---------- Map ---------- */
.map-head{padding-block:22px 6px;display:flex;align-items:end;gap:16px;flex-wrap:wrap;justify-content:space-between}
.map-head h2{font-family:var(--display);font-size:clamp(1.6rem,4.4vw,2.5rem);color:var(--gold)}
.map-head p{color:var(--muted)}
.mapframe{margin-top:10px;padding:7px;border-radius:24px;background:conic-gradient(var(--gold) 25%,var(--gold-deep) 0 50%,var(--gold) 0 75%,var(--gold-deep) 0) 0 0/14px 14px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.mapbox{border-radius:18px;overflow:hidden;background:var(--night)}
.mapbox svg{width:100%;height:auto;display:block}
.node{cursor:pointer}
.node:focus{outline:none}
.node .halo{fill:var(--gold);opacity:0}
.node.next .halo{animation:halo 1.6s ease-in-out infinite}
@keyframes halo{50%{opacity:.35}}
.node:focus-visible .halo{opacity:.6}
.node .rim{fill:var(--gold-deep);stroke:var(--gold);stroke-width:3;stroke-dasharray:6 3}
.node .medal{fill:var(--lapis-3);stroke:var(--gold-dark);stroke-width:2}
.node .lm{color:var(--ivory)}
.node.done .medal{fill:var(--gold)}
.node.done .lm{color:var(--lapis)}
.node:hover:not(.locked) .medal{filter:brightness(1.25)}
.node.locked{cursor:not-allowed}
.node.locked .rim{fill:#26304b;stroke:#4a5675}
.node.locked .medal{fill:#1a2440}
.node.locked .lm{color:#6d7895}
.numb{fill:var(--red);stroke:var(--ivory);stroke-width:2}
.numt{font-family:var(--display);font-size:11px;fill:var(--ivory);text-anchor:middle;dominant-baseline:central}
.sstar{fill:#33406a}
.sstar.on{fill:var(--gold-hi);stroke:var(--gold-dark);stroke-width:1}
.plaque{fill:rgba(10,20,48,.86);stroke:var(--line);stroke-width:1.5}
.node.done .plaque{stroke:var(--gold)}
.nlabel{font-family:var(--display);fill:var(--ivory);font-size:14.5px;text-anchor:middle}
.ntopic{font-family:var(--game);fill:var(--muted);font-size:11.5px;text-anchor:middle;font-weight:500}
.twinkle{animation:twinkle 3s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.2}}
.bob{animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.passport{margin-top:20px;display:grid;gap:14px}
.pp-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.passport h3{font-family:var(--display);color:var(--gold);font-size:1.25rem;letter-spacing:.06em}
.stamps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.stamp{border:2px dashed var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:grid;gap:4px;justify-items:center;min-width:0}
.stamp .sl{font-family:var(--game);font-size:.75rem;color:var(--muted);overflow-wrap:anywhere;line-height:1.2}
.stamp .ss{color:var(--gold-hi);letter-spacing:1px;font-size:.85rem;min-height:1.3em}
.stamp.on{border-style:solid;border-color:var(--gold);background:radial-gradient(circle,rgba(240,192,79,.18),rgba(240,192,79,.04));transform:rotate(-2deg)}
.stamp.on:nth-child(even){transform:rotate(2deg)}
.final-cta{display:flex;justify-content:center;padding-top:6px}
.teacher{margin-top:24px;display:flex;gap:18px;justify-content:center;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.teacher label{display:flex;gap:8px;align-items:center;cursor:pointer}
.linkish{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0;font-size:.85rem}

/* ---------- Station ---------- */
.station{padding-block:20px 0;display:grid;gap:16px}
.st-banner{display:flex;gap:18px;align-items:center}
.st-banner svg{flex:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.st-banner .t{display:grid;gap:4px;min-width:0}
.st-banner .eyebrow{color:var(--gold)}
.st-banner h2{font-family:var(--display);font-size:clamp(1.6rem,4.4vw,2.5rem);line-height:1.05}
.instr{color:var(--muted);max-width:46em}
.st-bar{display:flex;gap:12px;align-items:center}
.track{flex:1;position:relative;height:16px;border-radius:999px;background:var(--grout);border:2px solid var(--lapis-3);margin-inline:6px 20px}
.track-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:repeating-linear-gradient(90deg,var(--gold) 0 10px,var(--gold-deep) 10px 12px);transition:width .45s cubic-bezier(.3,1.4,.6,1)}
.track-tok{position:absolute;top:50%;left:0;transform:translate(-50%,-62%);transition:left .45s cubic-bezier(.3,1.4,.6,1);filter:drop-shadow(0 3px 2px rgba(0,0,0,.5))}
.track-flag{position:absolute;right:-16px;top:50%;transform:translateY(-75%)}
.miss b{color:var(--red)!important}
.frame{padding:7px;border-radius:24px;background:conic-gradient(var(--gold) 25%,var(--gold-deep) 0 50%,var(--gold) 0 75%,var(--gold-deep) 0) 0 0/14px 14px;box-shadow:0 18px 40px rgba(0,0,0,.4)}
.stage{background:radial-gradient(ellipse at top,var(--lapis-2),var(--lapis) 70%);border-radius:18px;padding:24px;min-height:300px}

.qcount{font-family:var(--game);font-weight:600;font-size:.85rem;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.q{font-family:var(--game);font-weight:600;font-size:clamp(1.3rem,3.6vw,1.75rem);margin:6px 0 18px;line-height:1.25}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--lapis-3);border:2px solid transparent;border-radius:16px;padding:14px 16px;font-weight:700;font-size:1.04rem;min-width:0;
  box-shadow:0 5px 0 var(--shadow);transition:transform .08s,box-shadow .08s,border-color .12s}
.opt .let{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--lapis);color:var(--gold);font-family:var(--game);font-weight:700}
.opt:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px);box-shadow:0 7px 0 var(--shadow)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.45}
.right{background:linear-gradient(#a6cc66,var(--olive))!important;color:#16210a!important;border-color:var(--ivory)!important;box-shadow:0 5px 0 var(--olive-dark)!important;opacity:1!important}
.right .let{background:var(--olive-dark);color:var(--ivory)}
.wrong{background:linear-gradient(#e2705b,var(--red))!important;color:#fff!important;box-shadow:0 5px 0 var(--red-dark)!important;opacity:1!important}
.wrong .let{background:var(--red-dark);color:#fff}
.explain{margin-top:18px;padding:16px 18px;border-radius:16px;background:rgba(5,11,31,.6);border:2px solid var(--line);display:grid;gap:14px;justify-items:start;animation:slidein .3s ease-out}
.explain.ok{border-color:var(--olive)}
.explain.no{border-color:var(--red)}
.explain p{max-width:62ch}
.explain strong{font-family:var(--game);font-weight:700;font-size:1.1rem}
.explain.ok strong{color:var(--olive)}
.explain.no strong{color:#ef8a77}
@keyframes slidein{from{transform:translateY(10px);opacity:0}}

/* Match */
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px}
.col{display:grid;gap:10px;align-content:start;min-width:0}
.col-h{font-family:var(--display);color:var(--gold);letter-spacing:.1em}
.mb,.mv{text-align:left;background:var(--lapis-3);border:2px solid transparent;border-radius:14px;padding:12px 14px;display:grid;gap:3px;min-width:0;box-shadow:0 4px 0 var(--shadow);transition:transform .1s,border-color .12s,opacity .3s}
.mb:hover:not(:disabled),.mv:hover:not(:disabled){border-color:var(--gold);transform:translateY(-2px)}
.mb-t{font-family:var(--game);font-weight:600;font-size:1.08rem}
.mb-d{font-size:.86rem;color:var(--muted)}
.ref{font-family:var(--game);font-weight:600;font-size:.82rem;color:var(--gold);letter-spacing:.03em}
.vt{font-size:.96rem;font-style:italic}
.sel{border-color:var(--gold-hi)!important;background:var(--lapis-4)!important;transform:translateY(-3px) scale(1.02)!important;box-shadow:0 0 0 4px rgba(240,192,79,.25),0 6px 0 var(--shadow)!important}
.locked{background:linear-gradient(rgba(147,185,86,.35),rgba(147,185,86,.18))!important;border-color:var(--olive)!important;cursor:default;box-shadow:none!important}
.locked .mb-d,.locked .vt{color:var(--ivory)}

/* Sort */
.sort{display:grid;gap:22px}
.scard{position:relative;background:linear-gradient(var(--ivory),#e8dcbf);color:var(--lapis);border-radius:18px;padding:30px 22px;text-align:center;display:grid;gap:10px;box-shadow:0 10px 0 var(--gold-deep),0 16px 30px rgba(0,0,0,.35);animation:deal .4s cubic-bezier(.3,1.5,.6,1);overflow:hidden}
.scard .qcount{color:var(--lapis-3)}
.stext{font-family:var(--game);font-weight:600;font-size:clamp(1.25rem,3.6vw,1.65rem);line-height:1.3}
@keyframes deal{from{transform:translateY(-30px) rotate(-5deg) scale(.9);opacity:0}}
.stampmark{position:absolute;right:14px;top:12px;font-family:var(--display);font-size:1rem;letter-spacing:.06em;padding:4px 12px;border:3px solid;border-radius:8px;transform:rotate(8deg);animation:stampin .3s cubic-bezier(.3,1.8,.6,1)}
.stampmark.ok{color:var(--olive-dark);border-color:var(--olive-dark)}
.stampmark.no{color:var(--red-dark);border-color:var(--red-dark)}
@keyframes stampin{from{transform:rotate(8deg) scale(2.4);opacity:0}}
.gates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gate{display:grid;justify-items:center;gap:8px;border:0;border-radius:16px;padding:16px 10px 14px;background:var(--lapis-3);font-family:var(--display);font-size:1.02rem;letter-spacing:.03em;min-width:0;box-shadow:0 5px 0 var(--shadow);transition:transform .08s}
.gate svg{width:46px;height:46px}
.gate:hover:not(:disabled){transform:translateY(-3px)}
.gate:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--shadow)}
.gate:disabled{cursor:default}
.g-cat{border-top:6px solid var(--red)}
.g-orth{border-top:6px solid var(--gold)}
.g-prot{border-top:6px solid var(--olive)}

/* Timeline */
.hint-line{font-family:var(--game);font-weight:500;color:var(--muted);margin-bottom:16px;font-size:1.05rem}
.hint-line b{color:var(--gold)}
.slots{list-style:none;padding:0;margin:0 0 22px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;position:relative}
.slots::before{content:"";position:absolute;left:4%;right:4%;top:22px;height:6px;border-radius:9px;background:repeating-linear-gradient(90deg,var(--gold-deep) 0 10px,transparent 10px 16px);z-index:0}
.slot{position:relative;z-index:1;display:grid;gap:6px;justify-items:center;text-align:center;min-width:0}
.slot-n{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--lapis);border:3px dashed var(--line);font-family:var(--display);color:var(--muted);font-size:1.1rem;transition:all .25s}
.slot-t{font-family:var(--game);font-size:.88rem;color:var(--muted);line-height:1.25;min-height:2.5em}
.slot-y{font-family:var(--game);color:var(--gold-hi);font-weight:700;font-size:1rem;min-height:1.5em}
.slot.filled .slot-n{background:var(--gold);border:3px solid var(--gold-hi);color:var(--lapis);animation:popin .35s cubic-bezier(.3,1.8,.6,1)}
.slot.filled .slot-t{color:var(--ivory)}
.slot.cur .slot-n{box-shadow:0 0 0 5px rgba(240,192,79,.35)}
@keyframes popin{from{transform:scale(.4)}}
.evs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

let AC=null;
function tone(f,d=.12,type='triangle',when=0,vol=.08){
  if(!S.sound)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;const t=AC.currentTime+when;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.03)}catch(e){}
}

const FX={c:$('#fx'),x:null,P:[],run:false};
function fxSize(){const d=window.devicePixelRatio||1;FX.c.width=innerWidth*d;FX.c.height=innerHeight*d;FX.x=FX.c.getContext('2d');FX.x.setTransform(d,0,0,d,0,0)}
const COLS=['#f0c04f','#ffe08a','#d4553f','#93b956','#f6eedb','#4f74c4'];
function fxLoop(){
  const x=FX.x;x.clearRect(0,0,innerWidth,innerHeight);
  FX.P=FX.P.filter(p=>p.life>0);
  for(const p of FX.P){p.vy+=p.g;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;
    x.globalAlpha=Math.min(1,p.life/25);x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
    if(p.star){x.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?p.s*.4:p.s;x.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}x.closePath();x.fill()}
    else x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.8);x.restore()}
  x.globalAlpha=1;
  if(FX.P.length)requestAnimationFrame(fxLoop);else{FX.run=false;x.clearRect(0,0,innerWidth,innerHeight)}
}
function addP(arr){if(reduced())return;if(!FX.x)fxSize();FX.P.push(...arr);if(!FX.run){FX.run=true;requestAnimationFrame(fxLoop)}}
function burst(el,n=26){if(!el)return;const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  addP(Array.from({length:n},()=>{const a=Math.random()*Math.PI*2,v=2+Math.random()*6;return{x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-2,g:.2,s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:pick(COLS),life:40+Math.random()*25,star:Math.random()<.35}}))}
function confetti(n=170){addP(Array.from({length:n},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,g:.04,s:6+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.2,c:pick(COLS),life:180+Math.random()*80,star:Math.random()<.25})))}
let annT;
function announce(a,b=''){const el=$('#announce');el.innerHTML=`<span class="a1">${a}</span>${b?`<span class="a2">${b}</span>`:''}`;el.classList.remove('go');void el.offsetWidth;el.classList.add('go');clearTimeout(annT);annT=setTimeout(()=>el.classList.remove('go'),1300)}

function drawBg(){
  const c=$('#bg'),x=c.getContext('2d'),d=window.devicePixelRatio||1,W=innerWidth,H=innerHeight;
  c.width=W*d;c.height=H*d;x.setTransform(d,0,0,d,0,0);x.fillStyle='#0a1430';x.fillRect(0,0,W,H);
  const s=22,j=()=>(Math.random()-.5)*2.6;
  for(let yy=0;yy<H+s;yy+=s)for(let xx=0;xx<W+s;xx+=s){
    const r=Math.random();
    x.fillStyle=r<.03?'rgba(240,192,79,.55)':r<.045?'rgba(212,85,63,.45)':`hsl(${220+Math.random()*12},${42+Math.random()*16}%,${13+Math.random()*8}%)`;
    x.beginPath();x.moveTo(xx+1+j(),yy+1+j());x.lineTo(xx+s-2+j(),yy+1+j());x.lineTo(xx+s-2+j(),yy+s-2+j());x.lineTo(xx+1+j(),yy+s-2+j());x.closePath();x.fill();
  }
}

/* ================= Map ================= */
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hill(W,H,base,amp,seed){const R=rng(seed);const p1=R()*6,p2=R()*6,f1=1.4+R()*2,f2=3+R()*3;let d=`M0 ${H} L0 ${base}`;
  for(let x=0;x<=W;x+=W/40){const y=base+Math.sin(x/W*Math.PI*f1+p1)*amp+Math.sin(x/W*Math.PI*f2+p2)*amp*.4;d+=` L${x.toFixed(1)} ${y.toFixed(1)}`}return d+` L${W} ${H} Z`}
function unlocked(i){return S.unlockAll||i===0||!!S.stars[STATIONS[i-1].id]}

  let d=`M ${P[0][0]} ${P[0][1]}`;
  for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];
    d+=narrow?` C ${a[0]} ${(a[1]+b[1])/2}, ${b[0]} ${(a[1]+b[1])/2}, ${b[0]} ${b[1]}`:` C ${(a[0]+b[0])/2} ${a[1]}, ${(a[0]+b[0])/2} ${b[1]}, ${b[0]} ${b[1]}`}
  const R=rng(7);

  const trees=Array.from({length:narrow?16:22},()=>{const x=R()*W,y=H*(.45+R()*.5),s=.7+R()*.6;if(P.some(p=>Math.hypot(p[0]-x,p[1]-y)<90))return '';
    return `<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) scale(${s.toFixed(2)})"><path d="M0 0V14" stroke="#3a2d1c" stroke-width="3"/><ellipse cx="0" cy="-4" rx="11" ry="9" fill="#2c4a3b"/><ellipse cx="-4" cy="-7" rx="6" ry="5" fill="#3b5f45"/></g>`}).join('');
  const moon=narrow?[345,48]:[70,72];
  const doneN=STATIONS.filter(s=>S.stars[s.id]).length;
  const nextI=STATIONS.findIndex((s,i)=>!S.stars[s.id]&&unlocked(i));
  const nodes=STATIONS.map((s,i)=>{const [x,y]=P[i];const st=S.stars[s.id]||0;const lk=!unlocked(i);
    const cls=['node',st?'done':'',lk?'locked':'',i===nextI?'next':''].join(' ');
    return `<g transform="translate(${x} ${y})"><g class="${cls}" data-i="${i}" role="button" tabindex="${lk?-1:0}" aria-label="Station ${ROMAN[i]}: ${s.place}, ${s.topic}${lk?' (locked)':st?`, ${st} of 3 stars`:''}">

  screen.innerHTML=`

    <circle cx="${moon[0]}" cy="${moon[1]}" r="60" fill="url(#moong)"/><circle cx="${moon[0]}" cy="${moon[1]}" r="22" fill="#f6eedb"/><circle cx="${moon[0]+9}" cy="${moon[1]-6}" r="19" fill="#0f2044"/>

  screen.querySelectorAll('.node').forEach(n=>{const go=()=>{const i=+n.dataset.i;if(unlocked(i)){sfx.tap(600);stationIntro(i)}else{tone(200,.12,'square',0,.03);n.classList.remove('shake');void n.getBBox;}};
    n.addEventListener('click',go);n.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}})});
  $('#unlockAll').onchange=e=>{S.unlockAll=e.target.checked;save();renderMap()};
  $('#newPlayer').onclick=confirmReset;$('#ppBadges').onclick=showBadges;
  const gn=$('#goNext');if(gn)gn.onclick=()=>stationIntro(nextI);
  [$('#sealBtn'),$('#sealTop')].forEach(b=>b&&(b.onclick=renderSeal));
  // place & walk the token
  const road=$('#road'),T=road.getTotalLength(),N=500,samples=[];
  for(let k=0;k<=N;k++){const l=T*k/N,q=road.getPointAtLength(l);samples.push([l,q.x,q.y])}
  const L=P.map(([x,y])=>{let best=0,bd=1e12;for(const [l,px,py] of samples){const dd=(px-x)**2+(py-y)**2;if(dd<bd){bd=dd;best=l}}return best});
  let c=0;while(c<6&&S.stars[STATIONS[c].id])c++;
  const doneLen=c>=6?T:L[c];
  const target=nextI>=0?nextI:5;
  const fromI=TOK_AT==null?target:TOK_AT,fromDone=DONE_AT==null?doneLen:DONE_AT;
  TOK_AT=target;DONE_AT=doneLen;
  walk(road,$('#tok'),$('#roadDone'),L[fromI],L[target],fromDone,doneLen,T);
}
function walk(path,tok,doneEl,fromL,toL,dFrom,dTo,T){
  const t0=performance.now(),dist=Math.max(Math.abs(toL-fromL),Math.abs(dTo-dFrom));
  const dur=reduced()||dist<1?0:Math.min(2200,500+dist*1.6);let lastStep=0;
  function f(t){const k=dur?Math.min(1,(t-t0)/dur):1;const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const q=path.getPointAtLength(fromL+(toL-fromL)*e);tok.setAttribute('transform',`translate(${q.x.toFixed(1)} ${q.y.toFixed(1)})`);
    doneEl.setAttribute('stroke-dasharray',`${(dFrom+(dTo-dFrom)*e).toFixed(1)} ${T+10}`);
    if(dur&&toL!==fromL&&t-lastStep>160&&k<1){sfx.step();lastStep=t}
    if(k<1)requestAnimationFrame(f);else if(dur&&toL!==fromL){sfx.tap(880)}}
  if(dur)setTimeout(()=>requestAnimationFrame(f),350);else f(t0);
}

function countUp(el,to){const t0=performance.now(),dur=reduced()?0:1000;(function f(t){const k=dur?Math.min(1,(t-t0)/dur):1;el.textContent='+'+Math.round(to*(1-Math.pow(1-k,3))).toLocaleString();if(k<1)requestAnimationFrame(f)})(t0)}
function finish(){
  stopTimers();const s=STATIONS[RUN.i];

  if(s.id==='vocab'&&RUN.hints===0)award('nohint');

/* ================= Games ================= */
function explainBox(stage,ok,head,body,label,next){
  const ex=stage.querySelector('.explain');ex.hidden=false;ex.className='explain '+(ok?'ok':'no');
  ex.innerHTML=`<p><strong>${head}</strong> ${body}</p><button class="btn primary">${label}</button>`;
  const b=ex.querySelector('button');b.onclick=()=>{sfx.tap(500);next()};b.focus({preventScroll:true});
  ex.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'});
}
function mcGame(qs,stage){
  const order=shuffle(qs.slice());let i=0;
  function show(){
    const q=order[i];const opts=shuffle(q.o.map((t,k)=>({t,ok:k===0})));
    stage.innerHTML=`<p class="qcount">Question ${i+1} of ${order.length}</p><h3 class="q">${q.q}</h3>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}"><span class="let">${'ABCD'[k]}</span><span>${o.t}</span></button>`).join('')}</div><div class="explain" hidden></div>`;
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.k];
      stage.querySelectorAll('.opt').forEach((x,k)=>{x.disabled=true;if(opts[k].ok)x.classList.add('right');else if(x!==b)x.classList.add('dim')});
      if(o.ok)good(b);else{b.classList.add('wrong');bad(b)}
      explainBox(stage,o.ok,o.ok?pick(PRAISE):'Not quite.',q.e,i+1<order.length?'Next question':'Finish station',()=>{i++;i<order.length?show():finish()});
    });
  }
  show();
}
function matchGame(stage){
  const items=BELIEFS.map((p,i)=>({...p,i}));
  const bs=shuffle(items.slice()),vs=shuffle(items.slice());let sb=null,sv=null,matched=0;
  stage.innerHTML=`<div class="match">
    <div class="col"><p class="col-h">Beliefs</p>${bs.map(b=>`<button class="mb" data-i="${b.i}"><span class="mb-t">${b.t}</span><span class="mb-d">${b.d}</span></button>`).join('')}</div>
    <div class="col"><p class="col-h">Scripture · BSB</p>${vs.map(v=>`<button class="mv" data-i="${v.i}"><span class="ref">${v.r}</span><span class="vt">“${v.v}”</span></button>`).join('')}</div>
  </div>`;
  function check(){
    if(!(sb&&sv))return;const a=sb,b=sv;sb=sv=null;
    if(a.dataset.i===b.dataset.i){[a,b].forEach(x=>{x.classList.remove('sel');x.classList.add('locked');x.disabled=true});burst(a,14);good(b);matched++;if(matched===items.length)setTimeout(finish,800)}
    else{[a,b].forEach(x=>x.classList.add('wrong'));bad(b);setTimeout(()=>[a,b].forEach(x=>x.classList.remove('wrong','sel')),550)}
  }
  stage.querySelectorAll('.mb').forEach(b=>b.onclick=()=>{if(sb)sb.classList.remove('sel');sb=b;b.classList.add('sel');sfx.tap(440);check()});
  stage.querySelectorAll('.mv').forEach(b=>b.onclick=()=>{if(sv)sv.classList.remove('sel');sv=b;b.classList.add('sel');sfx.tap(560);check()});
}

      <div class="gates">${BR.map(g=>`<button class="gate g-${g.k}" data-k="${g.k}">${SIGN(g.c)}<span>${g.n}</span></button>`).join('')}</div>
      <div class="explain" hidden></div></div>`;
    stage.querySelectorAll('.gate').forEach(b=>b.onclick=()=>{
      const ok=b.dataset.k===c.k,name=BR.find(g=>g.k===c.k).n;
      stage.querySelectorAll('.gate').forEach(x=>{x.disabled=true;if(x.dataset.k===c.k)x.classList.add('right');else if(x!==b)x.classList.add('dim')});
      const card=$('#scard');card.insertAdjacentHTML('beforeend',`<span class="stampmark ${ok?'ok':'no'}">${name}</span>`);
      if(ok)good(b);else{b.classList.add('wrong');bad(card)}
      explainBox(stage,ok,ok?pick(PRAISE):`That card belongs on the ${name} road.`,BREX[c.k],i+1<cards.length?'Next card':'Finish station',()=>{i++;i<cards.length?show():finish()});
    });
  }
  show();
}
function timelineGame(stage){
  let placed=0;const sh=shuffle(EVENTS.map((e,i)=>({...e,i})));
  stage.innerHTML=`<p class="hint-line" id="tlh">Round 1 · Tap the events from <b>earliest</b> to <b>latest</b>.</p>
    <ol class="slots">${EVENTS.map((_,k)=>`<li class="slot" data-k="${k}"><span class="slot-n">${ROMAN[k]}</span><span class="slot-t">?</span><span class="slot-y"></span></li>`).join('')}</ol>
    <div class="evs" id="evs">${sh.map(e=>`<button class="ev" data-i="${e.i}">${e.t}</button>`).join('')}</div>`;
  stage.querySelectorAll('.ev').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(i===placed){const sl=stage.querySelector(`.slot[data-k="${i}"]`);sl.classList.add('filled');sl.querySelector('.slot-t').textContent=EVENTS[i].s;b.disabled=true;good(sl.querySelector('.slot-n'));placed++;
      if(placed===EVENTS.length)setTimeout(yearsRound,800)}
    else bad(b);
  });
  function yearsRound(){
    let k=0;const evs=$('#evs');evs.style.display='block';
    $('#tlh').innerHTML='Round 2 · <b>When</b> did it happen? Pick the year.';
    announce('Round 2!');
    function one(){
      stage.querySelectorAll('.slot').forEach((s,j)=>s.classList.toggle('cur',j===k));
      evs.innerHTML=`<div class="yearq"><p class="qcount">Event ${k+1} of ${EVENTS.length}</p><p class="q">${EVENTS[k].t}</p><div class="years">${shuffle(EVENTS.map(e=>e.y)).map(y=>`<button class="year">${y}</button>`).join('')}</div></div>`;
      evs.querySelectorAll('.year').forEach(b=>b.onclick=()=>{
        if(b.textContent===EVENTS[k].y){b.classList.add('right');stage.querySelector(`.slot[data-k="${k}"] .slot-y`).textContent=EVENTS[k].y;good(b);k++;
          evs.querySelectorAll('.year').forEach(x=>x.disabled=true);
          if(k<EVENTS.length)setTimeout(one,600);else{stage.querySelectorAll('.slot').forEach(s=>s.classList.remove('cur'));setTimeout(finish,800)}}
        else{b.classList.add('wrong');b.disabled=true;bad(b)}
      });
    }
    one();
  }
}
function vocabGame(stage){
  const words=shuffle(VOCAB.slice());let w=0;
  function show(){
    const v=words[w];let letters=v.w.split('');do{shuffle(letters)}while(letters.join('')===v.w);
    let ans=[],hints=0,solved=false;
    stage.innerHTML=`<div class="vocab"><p class="qcount">Word ${w+1} of ${words.length} · ${v.w.length} letters</p>
      <p class="clue">${v.c}</p>
      <div class="answer" id="ans">${v.w.split('').map(()=>'<span class="ab"></span>').join('')}</div>
      <div class="tiles">${letters.map((l,k)=>`<button class="tile" data-k="${k}" aria-label="Letter ${l}">${l}</button>`).join('')}</div>
      <div class="vctl"><button class="btn ghost small" id="undo">Undo</button><button class="btn ghost small" id="clr">Clear</button><button class="btn ghost small" id="hint">Hint</button></div>
      <div class="explain" hidden style="justify-items:center;text-align:center"></div></div>`;
    const tiles=[...stage.querySelectorAll('.tile')],boxes=[...stage.querySelectorAll('.ab')];
    function draw(){boxes.forEach((b,j)=>{b.textContent=ans[j]!=null?letters[ans[j]]:'';b.classList.toggle('f',ans[j]!=null);b.classList.toggle('hinted',j<hints)});tiles.forEach((t,k)=>t.disabled=solved||ans.includes(k))}
    function check(){
      if(ans.length<v.w.length)return;
      if(ans.map(k=>letters[k]).join('')===v.w){solved=true;draw();$('#ans').classList.add('win');good($('#ans'));
        stage.querySelectorAll('.vctl button').forEach(b=>b.disabled=true);
        explainBox(stage,true,v.w+'!',v.x,w+1<words.length?'Next word':'Finish station',()=>{w++;w<words.length?show():finish()})}
      else{bad($('#ans'));setTimeout(()=>{ans=ans.slice(0,hints);draw()},450)}
    }
    tiles.forEach(t=>t.onclick=()=>{if(ans.length>=v.w.length)return;ans.push(+t.dataset.k);sfx.tap(380+ans.length*45);draw();check()});
    $('#undo').onclick=()=>{if(ans.length>hints){ans.pop();draw()}};
    $('#clr').onclick=()=>{ans=ans.slice(0,hints);draw()};
    $('#hint').onclick=()=>{
      if(hints>=v.w.length-1)return;hints++;RUN.hints++;RUN.mistakes++;$('#missN').textContent=RUN.mistakes;
      ans=[];for(let j=0;j<hints;j++){const k=letters.findIndex((l,idx)=>l===v.w[j]&&!ans.includes(idx));ans.push(k)}
      tone(300,.1);draw();check();
    };
    draw();
  }
  show();
}
function lightningGame(stage){
  const qs=shuffle(TF.slice()).slice(0,10);let i=0,broken=0;
  const seals=Array.from({length:10},(_,k)=>`<circle class="seal" data-s="${k}" cx="${78+k*16}" cy="96" r="6.5" fill="#d4553f" stroke="#ffe08a" stroke-width="1.5"/>`).join('');
  stage.innerHTML=`<div class="bolt">
    <svg class="biggate" id="gate" viewBox="0 0 300 130" aria-hidden="true">
      <defs><clipPath id="archclip"><path d="M60 126V58C60 6 240 6 240 58V126Z"/></clipPath></defs>
      <path d="M44 128V56C44 -8 256 -8 256 56V128Z" fill="#b8862a" stroke="#f0c04f" stroke-width="3"/>
      <g clip-path="url(#archclip)"><rect x="60" y="0" width="180" height="130" fill="#ffe08a"/><path d="M150 130L100 20M150 130L200 20M150 130L150 10" stroke="#fff6dc" stroke-width="10" opacity=".6"/>
        <rect class="door-l" x="60" y="0" width="90" height="130" fill="#22396e" stroke="#0a1430" stroke-width="2"/>
        <rect class="door-r" x="150" y="0" width="90" height="130" fill="#22396e" stroke="#0a1430" stroke-width="2"/></g>
      <path d="M150 20V126" stroke="#0a1430" stroke-width="2"/>
      <g id="seals">${seals}</g>
      <path d="M30 128H270" stroke="#f0c04f" stroke-width="4"/>
    </svg>
    <p class="hp">Seals remaining: <b id="hpN">10</b></p>
    <div id="tq" style="display:grid;gap:16px;justify-items:center;width:100%"></div></div>`;
  const tq=$('#tq');
  function show(){
    stopTimers();const q=qs[i];
    tq.innerHTML=`<p class="qcount">Statement ${i+1} of ${qs.length}</p>
      <div class="timer" id="tm" aria-hidden="true"><span></span></div>
      <p class="stmt">${q.s}</p>
      <div class="tf"><button class="btn tfb t" data-v="1">True</button><button class="btn tfb f" data-v="0">False</button></div>
      <div class="explain" hidden style="justify-items:center;text-align:center;width:100%;box-sizing:border-box"></div>`;
    const tm=$('#tm'),bar=tm.querySelector('span'),t0=performance.now(),dur=10000;let frac=1,doneQ=false,lastSec=10;
    const iv=setInterval(()=>{frac=Math.max(0,1-(performance.now()-t0)/dur);bar.style.transform=`scaleX(${frac})`;
      const sec=Math.ceil(frac*10);if(sec<lastSec){lastSec=sec;if(sec<=3&&sec>0){sfx.tick();tm.classList.add('low')}}
      if(frac<=0)answer(null,null)},50);TIMERS.push(iv);
    function answer(v,btn){
      if(doneQ)return;doneQ=true;stopTimers();
      tq.querySelectorAll('.tfb').forEach(b=>{b.disabled=true;if((b.dataset.v==='1')===q.a)b.classList.add('right');else b.classList.add('dim')});
      const ok=v===q.a,g=$('#gate');
      if(ok){const el=performance.now()-t0;if(el<2000)award('speed');
        const sl=g.querySelector(`.seal[data-s="${broken}"]`);if(sl){sl.classList.add('broken');burst(sl,18)}broken++;
        $('#hpN').textContent=10-broken;good(btn,Math.round(frac*100))}
      else{bad(btn||tq.querySelector('.stmt'));g.classList.remove('hit');void g.getBoundingClientRect();g.classList.add('hit')}
      const last=i+1>=qs.length;
      explainBox(tq,ok,ok?pick(PRAISE):v===null?'Time’s up!':'Not quite.',`${q.a?'True.':'False.'} ${q.e}`,last?'Open the Great Gate':'Next statement',()=>{
        i++;if(i<qs.length)return show();
        g.querySelectorAll('.seal').forEach(s=>s.classList.add('broken'));$('#hpN').textContent=0;
        tq.innerHTML='';g.classList.add('open');sfx.level();confetti(120);announce('The gate opens!');setTimeout(finish,1500)});
    }
    tq.querySelectorAll('.tfb').forEach(b=>b.onclick=()=>answer(b.dataset.v==='1',b));
  }
  show();
}
